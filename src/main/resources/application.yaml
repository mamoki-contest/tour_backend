spring:
  application:
    name: tour
  config:
    # 로컬에서는 .env 파일을, 배포 환경에서는 실제 환경변수를 사용한다.
    import: optional:file:.env[.properties]
  profiles:
    default: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  sql:
    init:
      # MySQL 은 내장 DB 가 아니므로 always 로 지정해야 data.sql 이 실행된다.
      mode: always
  jpa:
    # data.sql 이 스키마 생성 이후에 실행되도록 한다.
    defer-datasource-initialization: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
