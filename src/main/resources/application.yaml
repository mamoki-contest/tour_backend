spring:
  application:
    name: tour
  config:
    # 로컬에서는 .env 파일을, 배포 환경에서는 실제 환경변수를 사용한다.
    import: optional:file:.env[.properties]
  profiles:
    default: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 빈 값은 지정하지 않은 것으로 취급된다(BlankValueEnvironmentPostProcessor).
    # 계정 이름은 비어 있으면 뜻이 없으므로 기본값을 두지 않고 기동을 멈춘다.
    username: ${DB_USERNAME}
    # 비밀번호 없는 계정은 실제로 쓰이므로 빈 값을 기본값으로 되살린다.
    password: ${DB_PASSWORD:}
  sql:
    init:
      # MySQL 은 내장 DB 가 아니므로 always 로 지정해야 data.sql 이 실행된다.
      mode: always
  jpa:
    # data.sql 이 스키마 생성 이후에 실행되도록 한다.
    defer-datasource-initialization: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

tour:
  batch:
    schedule:
      # 적재·수집 스케줄. 기본은 모두 꺼짐이며, 하나도 켜지 않으면 스케줄러 자체가 뜨지 않는다.
      # 켜는 순간 사람이 명령을 치지 않아도 외부 API 호출이 나가므로 배포만으로 켜지지 않게 한다.
      # --job=... 으로 띄운 배치 프로세스에서는 켜져 있어도 뜨지 않는다.
      #
      # cron 과 시간대의 기본값은 BatchScheduleProperties 상수가 유일한 출처다. 여기에 다시
      # 적으면 한쪽만 바뀌어도 알 수 없으므로, 비워 두고 바꿀 때만 환경변수로 준다.
      # 기본값: 카탈로그 매월 1일 02:00, 언급량 매월 1일 03:00, 시간대 Asia/Seoul.
      zone: ${BATCH_SCHEDULE_ZONE:}
      mention:
        enabled: ${BATCH_SCHEDULE_MENTION_ENABLED:false}
        cron: ${BATCH_SCHEDULE_MENTION_CRON:}
      catalog:
        # 카탈로그 적재는 실패했을 때 사람이 봐야 하는 작업이라 운영에서도 켜지 않는 쪽을 권한다.
        enabled: ${BATCH_SCHEDULE_CATALOG_ENABLED:false}
        cron: ${BATCH_SCHEDULE_CATALOG_CRON:}
  api:
    kor-service:
      # 공공데이터포털 API 게이트웨이. 로컬에서 HTTPS 가 막히면 .env 로 http 를 지정한다.
      base-url: ${KOR_SERVICE_BASE_URL:https://apis.data.go.kr/B551011/KorService2}
      # 공공데이터포털 Encoding 키. 추가 인코딩 없이 그대로 사용한다.
      service-key: ${KOR_SERVICE_KEY:}
      mobile-app: tour
      connect-timeout: 5s
      read-timeout: 30s
    locgo-hub:
      base-url: ${LOCGO_HUB_BASE_URL:https://apis.data.go.kr/B551011/LocgoHubTarService1}
      service-key: ${KOR_SERVICE_KEY:}
      mobile-app: tour
      # 비우면 공급자 제공 지연을 감안해 두 달 전을 사용한다.
      base-ym: ${LOCGO_HUB_BASE_YM:}
      connect-timeout: 5s
      read-timeout: 30s
    tats-cnctr-rate:
      # 관광지별 조회일 기준 향후 30일 집중률 예측. 조회 단위가 시·군이라 시·군당 1회만 부른다.
      base-url: ${TATS_CNCTR_RATE_BASE_URL:https://apis.data.go.kr/B551011/TatsCnctrRateService}
      # KorService2·LocgoHub 와 같은 공공데이터포털 인증키를 공유한다.
      service-key: ${KOR_SERVICE_KEY:}
      mobile-app: tour
      # 한 행이 (관광지 1곳 × 1일) 이라 목록형 API 보다 행 수가 훨씬 많다.
      rows-per-page: ${TATS_CNCTR_RATE_ROWS:1000}
      # 시·군당 최대 페이지 수. 호출이 무한히 늘어나지 않도록 두는 상한이다.
      max-pages: ${TATS_CNCTR_RATE_MAX_PAGES:5}
      connect-timeout: 5s
      # 캐시가 비면 한 요청에서 시·군 수만큼 순차 호출한다. 목록 응답이 오래 잡히지 않도록 짧게 둔다.
      read-timeout: 15s
    tar-rlte-tar:
      # 관광지별 연관 관광지·음식점·숙박. 조회 단위가 시·군이라 시·군당 1회만 부른다.
      base-url: ${TAR_RLTE_TAR_BASE_URL:https://apis.data.go.kr/B551011/TarRlteTarService1}
      # KorService2·LocgoHub 와 같은 공공데이터포털 인증키를 공유한다.
      service-key: ${KOR_SERVICE_KEY:}
      mobile-app: tour
      # 비우면 데이터랩 계열의 제공 지연을 감안해 두 달 전을 사용한다.
      base-ym: ${TAR_RLTE_TAR_BASE_YM:}
      # 한 행이 (기준 관광지 1곳 × 연관 장소 1곳) 이라 시·군 하나에 수천 행이 온다.
      rows-per-page: ${TAR_RLTE_TAR_ROWS:1000}
      # 시·군당 최대 페이지 수. 호출이 무한히 늘어나지 않도록 두는 상한이다.
      max-pages: ${TAR_RLTE_TAR_MAX_PAGES:5}
      connect-timeout: 5s
      read-timeout: 30s
    data-lab:
      # 기초지자체 일별 방문자수. 지역 필터 파라미터가 없어 전국이 통째로 오고, 강원만 우리가 추린다.
      base-url: ${DATA_LAB_BASE_URL:https://apis.data.go.kr/B551011/DataLabService}
      # KorService2·LocgoHub 와 같은 공공데이터포털 인증키를 공유한다.
      service-key: ${KOR_SERVICE_KEY:}
      mobile-app: tour
      # 기준 기간의 마지막 날 고정값(yyyyMMdd). 비우면 lag-days 로 계산한다.
      end-ymd: ${DATA_LAB_END_YMD:}
      # 공급자 공개 지연. 2026-09-10 확인 기준 약 30일이다. 지연이 길어지면 늘린다.
      lag-days: ${DATA_LAB_LAG_DAYS:30}
      # 하루만 보면 요일 편차가 그대로 드러나 한 주를 묶는다.
      window-days: ${DATA_LAB_WINDOW_DAYS:7}
      # 하루가 전국 807행이라 7일이면 6천 행에 가깝다.
      rows-per-page: ${DATA_LAB_ROWS:1000}
      # 호출이 무한히 늘어나지 않도록 두는 상한이다.
      max-pages: ${DATA_LAB_MAX_PAGES:10}
      connect-timeout: 5s
      read-timeout: 30s
    its:
      # 국가교통정보센터. 공공데이터포털이 아니라 자체 포털에서 발급한 키를 쓴다.
      base-url: ${ITS_BASE_URL:https://openapi.its.go.kr:9443}
      api-key: ${ITS_API_KEY:}
      # 관광지 좌표에서 사방으로 볼 범위(도). 0.005 도가 약 555m 다.
      # 응답에 링크 좌표가 없어 가까운 도로를 고를 수 없어 범위로 좁힌다. 넓히면 관광지와
      # 상관없는 간선도로가 섞이고, 좁히면 시골에서 빈 응답이 된다.
      half-span: ${ITS_HALF_SPAN:0.005}
      connect-timeout: 5s
      # 상세 응답 안에서 부르므로 오래 잡지 않는다.
      read-timeout: 10s
    gn-its:
      # 강릉시 교통정보 조회서비스(실시간 주차). 강원에서 유일하게 실시간 잔여면을 여는 지자체다.
      # 인증키는 KorService2 계열과 같은 공공데이터포털 키지만 기관코드가 달라 base-url 은 따로 둔다.
      base-url: ${GN_ITS_BASE_URL:https://apis.data.go.kr/4201000/GNitsTrafficInfoService_1.0}
      service-key: ${KOR_SERVICE_KEY:}
      # 주차장이 13곳뿐이라 1회 호출로 끝낸다. pageNo 가 범위를 넘으면 빈 목록이 아니라
      # 전체를 다시 돌려주므로 페이지를 도는 순간 무한루프가 된다.
      rows-per-page: ${GN_ITS_ROWS:100}
      # 짧은 간격 연속 호출 시 HTTP 200 에 본문이 {} 만 오는 조용한 스로틀이 있다.
      # 그때 다시 물어볼 횟수와 기다릴 시간. 실측상 8초 이상 간격이면 스로틀이 사라진다.
      throttle-retries: ${GN_ITS_THROTTLE_RETRIES:2}
      throttle-backoff: ${GN_ITS_THROTTLE_BACKOFF:800ms}
      connect-timeout: 5s
      # 상세 응답 안에서 부르므로 오래 잡지 않는다.
      read-timeout: 10s
    naver:
      # 검색 API 는 NAVER API HUB 로 이관되었다. 개발자센터 도메인·헤더로는 인증되지 않는다.
      base-url: ${NAVER_API_HUB_BASE_URL:https://naverapihub.apigw.ntruss.com}
      key-id: ${NAVER_API_HUB_KEY_ID:}
      key: ${NAVER_API_HUB_KEY:}
      connect-timeout: 5s
      read-timeout: 15s
      # 키당 50 RPS 한도. 배치가 이 간격을 지켜 호출한다.
      call-delay: 50ms
      query:
        # 동명 장소를 가르기 위해 시·군명을 넣는다.
        include-sigungu: true
        # 검색어 뒤에 붙일 말. 비우면 붙이지 않는다.
        #
        # PRD v4 는 '여행'을 명시했으나 팀 논의(#33)로 빼기로 했다. 네이버 검색이 AND 라
        # 붙이는 순간 그 말과 함께 쓰이지 않은 글이 전부 빠지는데, 빠지는 폭이 장소 성격에
        # 따라 크게 다르다. 사찰인 낙산사는 5.2배, 오봉저수지는 123배 줄었다. 그러면
        # 실제 언급량이 아니라 여행 맥락에서 언급된 양을 재게 되어 정렬 지표로 쓸 수 없다.
        #
        # 되돌리려면 NAVER_QUERY_SUFFIX 에 값을 준다. 규칙이 바뀌면 queryRuleVersion 도
        # 함께 바뀌므로 어느 규칙으로 수집한 스냅샷인지는 그대로 추적된다.
        suffix: ${NAVER_QUERY_SUFFIX:}
        # 이름이 변별력을 잃었다고 볼 기준. 이름+시·군 검색 결과가 시·군 단독 검색 결과의
        # 이 비율을 넘으면 그 장소의 언급량으로 볼 수 없다고 보고 정렬에서 뺀다.
        #
        # 강릉으로 실측한 값이다. 일반명사는 '곳' 49.9%, '더원' 20.3%, '커피다' 19.2% 였고
        # 실제 관광지는 안목해변 4.6%, 경포해변 4.2%, 오죽헌 2.0% 였다. 사이가 네 배 벌어져
        # 있어 그 안 어디에 선을 그어도 갈린다.
        ambiguous-ratio: ${NAVER_AMBIGUOUS_RATIO:0.10}
  cors:
    # Vercel 배포 출처만 허용한다. 쉼표로 구분해 환경변수로 주입한다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
