spring:
  application:
    name: tour
  config:
    # 로컬에서는 .env 파일을, 배포 환경에서는 실제 환경변수를 사용한다.
    import: optional:file:.env[.properties]
  profiles:
    default: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
