spring:
  application:
    name: tour
  config:
    # 로컬에서는 .env 파일을, 배포 환경에서는 실제 환경변수를 사용한다.
    import: optional:file:.env[.properties]
  profiles:
    default: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  sql:
    init:
      # MySQL 은 내장 DB 가 아니므로 always 로 지정해야 data.sql 이 실행된다.
      mode: always
  jpa:
    # data.sql 이 스키마 생성 이후에 실행되도록 한다.
    defer-datasource-initialization: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

tour:
  api:
    kor-service:
      # 공공데이터포털 API 게이트웨이. 로컬에서 HTTPS 가 막히면 .env 로 http 를 지정한다.
      base-url: ${KOR_SERVICE_BASE_URL:https://apis.data.go.kr/B551011/KorService2}
      # 공공데이터포털 Encoding 키. 추가 인코딩 없이 그대로 사용한다.
      service-key: ${KOR_SERVICE_KEY:}
      mobile-app: tour
      connect-timeout: 5s
      read-timeout: 30s
  cors:
    # Vercel 배포 출처만 허용한다. 쉼표로 구분해 환경변수로 주입한다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
