spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${TEST_DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    hikari:
      # 스프링 컨텍스트마다 풀이 하나씩 생긴다. 빈을 갈아 끼우는 테스트(@MockitoBean)는
      # 컨텍스트를 따로 쓰므로 클래스가 늘수록 풀도 늘고, 기본값(10)이면 MySQL 의
      # max_connections 를 넘겨 "Too many connections" 로 컨텍스트 기동이 통째로 실패한다.
      # 테스트는 한 줄로 도는 데다 풀을 여럿 열어 둘 이유가 없다.
      maximum-pool-size: 3
      minimum-idle: 1
  jpa:
    hibernate:
      # 테스트 시작 시 스키마를 만들고 종료 시 삭제한다.
      # 반드시 tour_test 스키마만 가리켜야 한다.
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        # 같은 내용의 재적재가 행을 다시 쓰지 않는지(#77)를 확인하려면 UPDATE 가 몇 번
        # 나갔는지 물을 데가 있어야 한다. 통계 수집은 그 자체로 비용이고 이 물음은 테스트
        # 에서만 묻기 때문에 운영·로컬 프로파일에는 켜지 않는다.
        generate_statistics: true
